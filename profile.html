<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b12"><title>Player profile · TRS CIS League</title><style>
:root{color-scheme:dark;--bg:#0b0b12;--panel:#15151d;--line:#ffffff18;--muted:#8f8f9e;--purple:#8b6dea;--green:#35d39a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f1f0f5;background:radial-gradient(ellipse at 12% 3%,#261d3c 0,transparent 38%),#0b0b12;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1120px)/2));background:#0b0b12d9}.brand{font-size:14px;font-weight:800}.brand span{color:#ac91ff}.navlinks{display:flex;gap:22px;color:#a4a2b1;font-size:12px;font-weight:700}.navlinks a:hover{color:#fff}.button{border:1px solid var(--line);border-radius:9px;padding:10px 14px;color:#f7f5fb;background:#ffffff08;font-size:12px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.button:hover{background:#ffffff12}.primary{background:#7252bf;border-color:#7252bf}.primary:hover{background:#8464d0}.wrap{width:min(1060px,calc(100% - 32px));margin:auto}.hero{padding:72px 0 52px;display:flex;align-items:center;justify-content:space-between;gap:24px}.hero h1{font-size:clamp(32px,5vw,49px);line-height:1.1;margin:0 0 11px;letter-spacing:-.03em}.hero p{color:#aaa7b5;line-height:1.7;max-width:590px;margin:0}.card{background:#15151d;border:1px solid var(--line);border-radius:15px;padding:20px}.hero .card{width:min(350px,100%)}.eyebrow{font-size:10px;color:#a98cf3;letter-spacing:.14em;font-weight:800;text-transform:uppercase}.card h2{font-size:16px;margin:9px 0 6px}.card p{font-size:12px;color:var(--muted);line-height:1.55}.actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}.section{padding:26px 0 60px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:15px}.section h2{font-size:19px;margin:0 0 5px}.section p{font-size:12px;color:var(--muted);margin:0}.search input{width:min(280px,45vw);border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#111118;color:#fff;outline:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.player{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:#14141c;border-radius:12px;padding:12px}.player:hover{border-color:#8b6dea88}.avatar{width:43px;height:43px;border-radius:50%;object-fit:cover;background:#292632}.player b{font-size:12px}.player small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.check{margin-left:auto;color:var(--green);font-size:12px}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:12px}.panel{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.panel.open{display:flex}.dialog{width:min(420px,100%);padding:28px;background:#15151d;border:1px solid #ffffff20;border-radius:16px;box-shadow:0 22px 70px #0009;position:relative;text-align:center}.dialog .brand-mark{margin:0 auto 20px;width:48px;height:48px;border:1px solid #9f83ee77;border-radius:14px;color:#c0aaff;display:grid;place-items:center;font-weight:900;font-size:15px}.dialog h2{font-size:22px;margin:0 0 8px}.dialog p{font-size:12px;line-height:1.6;color:#a5a2b1;margin:0 auto 18px;max-width:330px}.dialog .button{width:100%;padding:12px}.close{position:absolute;right:13px;top:10px;border:0;background:none;color:#999;font-size:21px;cursor:pointer}.fine{font-size:10px;color:#777482;margin-top:12px}.err{color:#ff8793;font-size:11px;min-height:16px;margin-top:10px}.userbar{display:flex;gap:9px;align-items:center;color:#bbb;font-size:12px}.userbar img{width:27px;height:27px;border-radius:50%}footer{border-top:1px solid var(--line);padding:19px 0;color:#777482;font-size:10px}@media(max-width:720px){.hero{padding:48px 0 25px;align-items:stretch;flex-direction:column}.hero .card{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.navlinks{gap:12px}}@media(max-width:650px){.profile-content{grid-template-columns:1fr!important}}@media(max-width:500px){.nav{height:60px;padding:0 15px}.navlinks{display:none}.wrap{width:calc(100% - 28px)}.grid{grid-template-columns:1fr}.section-head{align-items:stretch;flex-direction:column}.search input{width:100%}.dialog{padding:23px 18px}}
</style></head><body>
<header class="nav"><a class="brand" href="/">TRS <span>CIS</span> LEAGUE</a><nav class="navlinks"><a href="/">Home</a><a href="/#members">Members</a><a href="/league.html">League</a></nav><div class="userbar"><button class="button" id="logout" style="display:none">Log out</button><a class="button" href="/">Back to members</a></div></header>
<main class="wrap" style="padding-top:32px;padding-bottom:70px" id="app"><div class="card">Loading profile...</div></main>
<script>
const app=document.getElementById('app');let activeTab='Overview',profile=null,self=false;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){
try{
const u=new URLSearchParams(location.search).get('u');
if(u){const r=await fetch('/api/profiles?username='+encodeURIComponent(u),{cache:'no-store'});if(!r.ok)throw Error();profile=(await r.json()).profile}
else{const s=await fetch('/api/verification/status',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json());if(!s.authenticated||!s.profile){location.replace('/');return}profile={discord:s.profile.discord,verifiedAt:s.profile.verifiedAt,discordCreatedAt:s.profile.discordCreatedAt};self=true;document.getElementById('logout').style.display='inline-flex'}
draw()
}catch{app.innerHTML='<section class="card" style="margin:10vh auto;max-width:520px;text-align:center"><h2>Profile not found</h2><p>The member may not be verified or the profile link is incorrect.</p><a class="button primary" href="/">Return to members</a></section>'}
}
function draw(){const d=profile.discord||{},handle=d.handle||d.username,tab=activeTab;
let content='';
if(tab==='Overview')content='<section class="card"><h2>In game</h2><p>League account and member information</p><div class="card" style="padding:14px;margin-top:14px"><b>TRS CIS League member</b><p style="margin:5px 0 0">Your Discord account is connected to this profile.</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px"><div class="card"><small class="muted">Verified</small><p style="margin:7px 0 0"><b>'+esc(new Date(profile.verifiedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}))+'</b></p></div><div class="card"><small class="muted">Discord account created</small><p style="margin:7px 0 0"><b>'+esc(profile.discordCreatedAt?new Date(profile.discordCreatedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—')+'</b></p></div><div class="card"><small class="muted">Status</small><p style="margin:7px 0 0;color:var(--green)"><b>Verified</b></p></div></div></section><section class="card"><h2>Account status</h2><p>Verification status for this league profile.</p><div style="font-size:23px;font-weight:800;color:var(--green);margin-top:24px">Verified</div><p>Discord account connected</p></section>';
if(tab==='Registration')content='<section class="card"><h2>Registration</h2><p>Account registration details</p><div class="card"><small class="muted">Joined TRS CIS League</small><p><b>'+esc(new Date(profile.verifiedAt).toLocaleString('en-GB'))+'</b></p><small class="muted">Discord username</small><p><b>'+esc(handle?'@'+handle:'—')+'</b></p></div></section>';
if(tab==='Achievements')content='<section class="card"><h2>Achievements</h2><p>League achievements will appear here.</p><div class="empty">No achievements yet.</div></section>';
if(tab==='Integrations')content='<section class="card"><h2>Integrations</h2><p>Accounts connected to this profile</p><div class="member" style="display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:12px"><img class="avatar" style="width:52px;height:52px" src="'+esc(d.avatar)+'" alt=""><div><b>Discord</b><small style="display:block;color:var(--muted);margin-top:5px">@'+esc(handle)+'</small></div><span style="margin-left:auto;color:var(--green);font-size:11px;font-weight:800">CONNECTED</span></div></section>';
app.innerHTML='<section class="card" style="padding:24px;background:linear-gradient(110deg,#211a32,#15151d 65%);display:flex;align-items:center;gap:18px;flex-wrap:wrap"><img class="avatar" style="width:82px;height:82px;border-radius:19px" src="'+esc(d.avatar)+'" alt=""><div style="flex:1;min-width:180px"><small class="muted">TRS CIS League member</small><h1 style="font-size:31px;margin:5px 0">'+esc(d.username||handle)+'</h1><span class="muted">@'+esc(handle)+'</span><div style="margin-top:11px"><span class="button" style="border-color:#6650a5;color:#d2c4ff">Discord · '+esc(handle)+'</span></div></div><div class="card" style="padding:12px 17px"><b>Verified</b><small style="display:block;color:var(--muted);margin-top:5px">Member status</small></div></section><nav class="card" style="display:flex;gap:6px;flex-wrap:wrap;padding:7px;margin:13px 0 22px">'+['Overview','Registration','Achievements','Integrations'].map(t=>'<button class="button tab '+(t===tab?'primary':'')+'" data-tab="'+t+'">'+t+'</button>').join('')+'</nav><div class="grid profile-content" style="align-items:start">'+content+'</div>';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;draw()})
}
document.getElementById('logout').onclick=()=>location.assign('/api/logout');load();
</script></body></html>
